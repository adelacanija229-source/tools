<title>즉석 WebP 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf5;
    --surface: #ffffff;
    --surface-2: #fff4e8;
    --text: #2b211d;
    --text-muted: #8a7a6f;
    --accent: #d97706;
    --accent-strong: #b45309;
    --accent-soft: #fef0dc;
    --border: #ecdfd0;
    --success: #15803d;
    --success-soft: #eaf7ee;
    --shadow: 0 1px 2px rgba(43,33,25,0.04), 0 8px 24px rgba(43,33,25,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1512;
      --surface: #241d18;
      --surface-2: #2e2119;
      --text: #f3e9de;
      --text-muted: #b3a294;
      --accent: #f59e0b;
      --accent-strong: #fbbf24;
      --accent-soft: #3a2a18;
      --border: #3c2f26;
      --success: #4ade80;
      --success-soft: #17291d;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1512;
    --surface: #241d18;
    --surface-2: #2e2119;
    --text: #f3e9de;
    --text-muted: #b3a294;
    --accent: #f59e0b;
    --accent-strong: #fbbf24;
    --accent-soft: #3a2a18;
    --border: #3c2f26;
    --success: #4ade80;
    --success-soft: #17291d;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 28px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 620px; }

  header { margin-bottom: 20px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 10px 0 4px;
    text-wrap: balance;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .drop {
    margin-top: 20px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    background: var(--surface);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop:hover, .drop.drag {
    border-color: var(--accent);
    background: var(--surface-2);
  }
  .drop-icon { font-size: 28px; margin-bottom: 8px; }
  .drop strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .drop span { color: var(--text-muted); font-size: 13px; }
  .drop input { display: none; }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .controls label {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .controls input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .controls .val {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    min-width: 34px;
    text-align: right;
  }

  ul.results {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .item img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface-2);
  }
  .item .name {
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .item .meta .saved {
    color: var(--success);
    font-weight: 600;
  }
  .item .state {
    font-size: 12px;
    color: var(--text-muted);
  }
  .dl-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .dl-btn:hover { background: var(--accent-strong); }

  footer {
    margin-top: 22px;
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  footer span { display: inline-flex; align-items: center; gap: 5px; }

  [hidden] { display: none !important; }
</style>

<main>
  <header>
    <span class="eyebrow">⚡ LOCAL WEB APP</span>
    <h1>즉석 WebP 변환기</h1>
    <p>이미지는 서버로 전송되지 않습니다. 이 브라우저 안에서만 변환됩니다.</p>
  </header>

  <div class="drop" id="drop">
    <div class="drop-icon">🖼️</div>
    <strong>이미지를 드래그하거나 클릭해서 선택하세요</strong>
    <span>PNG / JPG 여러 장 동시 지원</span>
    <input type="file" id="file-input" accept="image/png,image/jpeg" multiple>
  </div>

  <div class="controls">
    <label for="quality">압축 품질</label>
    <input type="range" id="quality" min="0.4" max="1" step="0.05" value="0.8">
    <span class="val" id="quality-val">80%</span>
  </div>

  <ul class="results" id="results"></ul>

  <footer>
    <span>🔒 서버 업로드 0%</span>
    <span>💾 평균 용량 절감 60~80%</span>
    <span>📱 모바일 브라우저에서도 동작</span>
  </footer>
</main>

<script>
  const drop = document.getElementById('drop');
  const input = document.getElementById('file-input');
  const list = document.getElementById('results');
  const qualityEl = document.getElementById('quality');
  const qualityVal = document.getElementById('quality-val');

  let downloadsApi = null;
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        downloadsApi = await window.claude.use('downloads');
      }
    } catch (e) { downloadsApi = null; }
  })();

  qualityEl.addEventListener('input', () => {
    qualityVal.textContent = Math.round(qualityEl.value * 100) + '%';
  });

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  input.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(fileList) {
    [...fileList].filter(f => /^image\/(png|jpeg)$/.test(f.type)).forEach(convertOne);
  }

  function fmtSize(bytes) {
    return bytes > 1024 * 1024
      ? (bytes / 1024 / 1024).toFixed(2) + 'MB'
      : Math.round(bytes / 1024) + 'KB';
  }

  function convertOne(file) {
    const li = document.createElement('li');
    li.className = 'item';
    const thumbUrl = URL.createObjectURL(file);
    li.innerHTML = `
      <img src="${thumbUrl}" alt="">
      <div>
        <div class="name">${file.name}</div>
        <div class="meta state">변환 중…</div>
      </div>
      <span></span>
    `;
    list.prepend(li);

    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = img.width;
      canvas.height = img.height;
      canvas.getContext('2d').drawImage(img, 0, 0);
      canvas.toBlob((blob) => {
        const saved = Math.max(0, Math.round((1 - blob.size / file.size) * 100));
        const meta = li.querySelector('.meta');
        meta.innerHTML = `${fmtSize(file.size)} → ${fmtSize(blob.size)} <span class="saved">-${saved}%</span>`;
        const outName = file.name.replace(/\.[^.]+$/, '') + '.webp';

        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'dl-btn';
        btn.innerHTML = '⬇️ 다운로드';
        btn.addEventListener('click', () => downloadBlob(blob, outName, btn));
        li.querySelector('span').replaceWith(btn);
      }, 'image/webp', parseFloat(qualityEl.value));
    };
    img.src = thumbUrl;
  }

  async function downloadBlob(blob, filename, btn) {
    const original = btn.innerHTML;
    if (downloadsApi) {
      btn.disabled = true;
      btn.innerHTML = '저장 중…';
      try {
        await downloadsApi.save({ filename, data: blob });
        btn.innerHTML = '✅ 저장됨';
      } catch (err) {
        btn.innerHTML = err && err.code === 'declined' ? original : '저장 실패';
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
        return;
      }
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
      return;
    }
    // 클로드 아티팩트 뷰어가 아닌 일반 웹 호스팅(예: 블로그 임베드)에서는 표준 다운로드 링크로 저장합니다.
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }
</script>
