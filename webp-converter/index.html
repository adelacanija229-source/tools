<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>즉석 WebP 변환기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf5;
    --surface: #ffffff;
    --surface-2: #fff4e8;
    --text: #2b211d;
    --text-muted: #8a7a6f;
    --accent: #d97706;
    --accent-strong: #b45309;
    --accent-soft: #fef0dc;
    --border: #ecdfd0;
    --success: #15803d;
    --success-soft: #eaf7ee;
    --danger: #b91c1c;
    --danger-soft: #fef2f2;
    --danger-border: #fecaca;
    --shadow: 0 1px 2px rgba(43,33,25,0.04), 0 8px 24px rgba(43,33,25,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1512;
      --surface: #241d18;
      --surface-2: #2e2119;
      --text: #f3e9de;
      --text-muted: #b3a294;
      --accent: #f59e0b;
      --accent-strong: #fbbf24;
      --accent-soft: #3a2a18;
      --border: #3c2f26;
      --success: #4ade80;
      --success-soft: #17291d;
      --danger: #fca5a5;
      --danger-soft: #2c1717;
      --danger-border: #5b2626;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1512;
    --surface: #241d18;
    --surface-2: #2e2119;
    --text: #f3e9de;
    --text-muted: #b3a294;
    --accent: #f59e0b;
    --accent-strong: #fbbf24;
    --accent-soft: #3a2a18;
    --border: #3c2f26;
    --success: #4ade80;
    --success-soft: #17291d;
    --danger: #fca5a5;
    --danger-soft: #2c1717;
    --danger-border: #5b2626;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 28px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 620px; }

  header { margin-bottom: 20px; }
  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--accent-strong);
    background: var(--accent-soft);
    padding: 4px 10px;
    border-radius: 999px;
  }
  h1 {
    font-size: 22px;
    font-weight: 800;
    margin: 10px 0 4px;
    text-wrap: balance;
  }
  header p {
    margin: 0;
    color: var(--text-muted);
    font-size: 14px;
    line-height: 1.6;
  }

  .drop {
    margin-top: 20px;
    border: 2px dashed var(--border);
    border-radius: 14px;
    background: var(--surface);
    padding: 36px 20px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .drop:hover, .drop.drag {
    border-color: var(--accent);
    background: var(--surface-2);
  }
  .drop-icon { font-size: 28px; margin-bottom: 8px; }
  .drop strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .drop span { color: var(--text-muted); font-size: 13px; }
  .drop input { display: none; }

  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 16px;
    padding: 12px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
  }
  .controls label {
    font-size: 13px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .controls input[type="range"] {
    flex: 1;
    accent-color: var(--accent);
  }
  .controls .val {
    font-family: "JetBrains Mono", monospace;
    font-size: 13px;
    font-weight: 600;
    min-width: 34px;
    text-align: right;
  }

  ul.results {
    list-style: none;
    margin: 18px 0 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .item {
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .item.err {
    grid-template-columns: 1fr;
    background: var(--danger-soft);
    border-color: var(--danger-border);
    box-shadow: none;
  }
  .item.err .name { color: var(--danger); }
  .item.err .meta {
    font-family: inherit;
    color: var(--text);
    line-height: 1.65;
    white-space: normal;
  }
  .item img {
    width: 44px;
    height: 44px;
    object-fit: cover;
    border-radius: 6px;
    background: var(--surface-2);
  }
  .item .name {
    font-size: 13px;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .item .meta {
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }
  .item .meta .saved {
    color: var(--success);
    font-weight: 600;
  }
  .item .note {
    font-family: inherit;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 3px;
    line-height: 1.55;
  }
  .item .state {
    font-size: 12px;
    color: var(--text-muted);
  }
  .btns { display: flex; flex-direction: column; gap: 6px; }
  .dl-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    background: var(--accent);
    color: #fff;
    border: none;
    font-family: inherit;
    cursor: pointer;
    text-decoration: none;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 700;
    white-space: nowrap;
  }
  .dl-btn:hover { background: var(--accent-strong); }
  .dl-btn.sub {
    background: var(--surface-2);
    color: var(--accent-strong);
    border: 1px solid var(--border);
  }
  .dl-btn.sub:hover { background: var(--accent-soft); }

  footer {
    margin-top: 22px;
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-muted);
    flex-wrap: wrap;
  }
  footer span { display: inline-flex; align-items: center; gap: 5px; }

  [hidden] { display: none !important; }
</style>
</head>
<body>

<main>
  <header>
    <span class="eyebrow">⚡ LOCAL WEB APP</span>
    <h1>즉석 WebP 변환기</h1>
    <p>이미지는 서버로 전송되지 않습니다. 이 브라우저 안에서만 변환됩니다.</p>
  </header>

  <div class="drop" id="drop">
    <div class="drop-icon">🖼️</div>
    <strong>이미지를 드래그하거나 클릭해서 선택하세요</strong>
    <span>PNG / JPG 여러 장 동시 지원</span>
    <input type="file" id="file-input" accept="image/*" multiple>
  </div>

  <div class="controls">
    <label for="quality">압축 품질</label>
    <input type="range" id="quality" min="0.4" max="1" step="0.05" value="0.8">
    <span class="val" id="quality-val">80%</span>
  </div>

  <ul class="results" id="results"></ul>

  <footer>
    <span>🔒 서버 업로드 0%</span>
    <span>💾 평균 용량 절감 60~80%</span>
    <span>📱 모바일 브라우저에서도 동작</span>
  </footer>
</main>

<script>
  const drop = document.getElementById('drop');
  const input = document.getElementById('file-input');
  const list = document.getElementById('results');
  const qualityEl = document.getElementById('quality');
  const qualityVal = document.getElementById('quality-val');

  // 아이폰은 사진 앱이 WebP를 안 받아서, 저장 경로를 따로 안내해야 합니다.
  const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent)
    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  // 휴대폰 캔버스는 픽셀 수 한계가 있어, 넘으면 toBlob이 조용히 실패합니다.
  const MAX_PIXELS = 16000000;

  // 이 브라우저가 WebP로 저장할 수 있는지 먼저 확인합니다.
  // 안 되는데 그냥 요청하면 파일명만 .webp 이고 내용은 PNG 인 파일이 나옵니다.
  const CAN_WEBP = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 1;
    return c.toDataURL('image/webp').indexOf('data:image/webp') === 0;
  })();
  const OUT_MIME = CAN_WEBP ? 'image/webp' : 'image/jpeg';
  const OUT_EXT = CAN_WEBP ? 'webp' : 'jpg';

  qualityEl.addEventListener('input', () => {
    qualityVal.textContent = Math.round(qualityEl.value * 100) + '%';
  });

  drop.addEventListener('click', () => input.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('drag'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('drag'));
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.classList.remove('drag');
    handleFiles(e.dataTransfer.files);
  });
  input.addEventListener('change', (e) => handleFiles(e.target.files));

  function handleFiles(fileList) {
    [...fileList].forEach((f) => {
      if (f.type.startsWith('image/')) convertOne(f);
      else showError(f.name, '이미지 파일이 아닙니다. PNG 또는 JPG를 올려주세요.');
    });
  }

  function fmtSize(bytes) {
    return bytes > 1024 * 1024
      ? (bytes / 1024 / 1024).toFixed(2) + 'MB'
      : Math.round(bytes / 1024) + 'KB';
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function showError(name, msg) {
    const li = document.createElement('li');
    li.className = 'item err';
    li.innerHTML = '<div><div class="name">' + esc(name) + '</div><div class="meta">' + msg + '</div></div>';
    list.prepend(li);
  }

  function convertOne(file) {
    const li = document.createElement('li');
    li.className = 'item';
    const thumbUrl = URL.createObjectURL(file);
    li.innerHTML = '<img src="' + thumbUrl + '" alt="">'
      + '<div><div class="name">' + esc(file.name) + '</div>'
      + '<div class="meta state">변환 중…</div></div><span class="slot"></span>';
    list.prepend(li);

    const img = new Image();

    img.onerror = () => {
      URL.revokeObjectURL(thumbUrl);
      li.remove();
      showError(file.name,
        '이 이미지를 읽지 못했습니다.<br>'
        + '아이폰에서 찍은 사진은 <b>HEIC</b> 형식이라 안드로이드·PC 브라우저에서 열리지 않습니다.<br>'
        + '아이폰 <b>설정 → 카메라 → 포맷 → 높은 호환성</b>으로 바꾸거나, JPG로 저장한 뒤 올려주세요.');
    };

    img.onload = () => {
      let w = img.naturalWidth || img.width;
      let h = img.naturalHeight || img.height;
      if (!w || !h) {
        URL.revokeObjectURL(thumbUrl);
        li.remove();
        showError(file.name, '이미지 크기를 읽지 못했습니다.');
        return;
      }

      // 너무 큰 사진은 줄여서 그립니다. 안 그러면 변환이 통째로 실패합니다.
      let scaled = false;
      if (w * h > MAX_PIXELS) {
        const r = Math.sqrt(MAX_PIXELS / (w * h));
        w = Math.floor(w * r);
        h = Math.floor(h * r);
        scaled = true;
      }

      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);

      canvas.toBlob((blob) => {
        if (!blob) {
          URL.revokeObjectURL(thumbUrl);
          li.remove();
          showError(file.name, '변환에 실패했습니다. 사진 크기가 너무 크면 실패할 수 있으니, 조금 작은 사진으로 다시 시도해주세요.');
          return;
        }
        // 아이폰 사진 앱은 WebP를 못 받습니다. 눌렀을 때 바로 공유되도록
        // JPG 사본을 미리 만들어 둡니다(터치 순간에 만들면 iOS가 공유를 막습니다).
        if (!CAN_WEBP) { render(li, blob, null, file, scaled, w, h); return; }
        canvas.toBlob(function (jpg) {
          render(li, blob, jpg, file, scaled, w, h);
        }, 'image/jpeg', parseFloat(qualityEl.value));
      }, OUT_MIME, parseFloat(qualityEl.value));
    };

    img.src = thumbUrl;
  }

  // 공유 시트가 되면 공유로, 안 되면 일반 다운로드로 저장합니다.
  function saveOrShare(blob, name, mime) {
    try {
      const f = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        navigator.share({ files: [f], title: name }).catch(function () {});
        return;
      }
    } catch (e) { /* 공유 불가 환경은 아래로 */ }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function render(li, blob, jpgBlob, file, scaled, w, h) {
    const outName = file.name.replace(/\.[^.]+$/, '') + '.' + OUT_EXT;
    const url = URL.createObjectURL(blob);
    const saved = Math.max(0, Math.round((1 - blob.size / file.size) * 100));

    const meta = li.querySelector('.meta');
    meta.classList.remove('state');
    meta.innerHTML = fmtSize(file.size) + ' → ' + fmtSize(blob.size)
      + ' <span class="saved">-' + saved + '%</span>';

    const notes = [];
    if (scaled) notes.push('사진이 커서 ' + w + '×' + h + ' 로 줄여 변환했습니다.');
    if (!CAN_WEBP) notes.push('이 브라우저는 WebP 저장을 지원하지 않아 <b>JPG</b>로 변환했습니다.');
    if (IS_IOS) notes.push('아이폰 사진 앱은 WebP를 받지 않습니다. 사진 앱에 넣으려면 <b>[JPG로 저장]</b>, WebP 그대로 두려면 [저장/공유] 후 <b>"파일에 저장"</b>을 고르세요.');
    if (notes.length) {
      const p = document.createElement('div');
      p.className = 'note';
      p.innerHTML = notes.join('<br>');
      meta.parentNode.appendChild(p);
    }

    const box = document.createElement('div');
    box.className = 'btns';

    // 1순위: 공유 시트. 아이폰에서 '파일에 저장'까지 갈 수 있는 가장 확실한 길입니다.
    let shared = false;
    try {
      const f = new File([blob], outName, { type: OUT_MIME });
      if (navigator.canShare && navigator.canShare({ files: [f] })) {
        shared = true;
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'dl-btn';
        b.innerHTML = '📤 저장 / 공유';
        b.addEventListener('click', () => navigator.share({ files: [f], title: outName }).catch(() => {}));
        box.appendChild(b);
      }
    } catch (e) { /* 공유 불가 환경은 아래 방법으로 */ }

    // 2순위: 일반 다운로드. PC와 안드로이드는 이걸로 바로 저장됩니다.
    const a = document.createElement('a');
    a.href = url;
    a.download = outName;
    a.className = 'dl-btn' + (shared ? ' sub' : '');
    a.innerHTML = '⬇️ 다운로드';
    box.appendChild(a);

    // WebP를 못 받는 곳(아이폰 사진 앱 등)을 위한 JPG 사본.
    if (jpgBlob) {
      const jname = file.name.replace(/\.[^.]+$/, '') + '.jpg';
      const j = document.createElement('button');
      j.type = 'button';
      j.className = 'dl-btn sub';
      j.innerHTML = '🖼 JPG로 저장 (' + fmtSize(jpgBlob.size) + ')';
      j.addEventListener('click', function () { saveOrShare(jpgBlob, jname, 'image/jpeg'); });
      box.appendChild(j);
    }

    // 3순위: 아이폰에서 위 둘이 막혔을 때. 새 탭으로 열면 사파리 공유 버튼을 쓸 수 있습니다.
    if (IS_IOS) {
      const o = document.createElement('button');
      o.type = 'button';
      o.className = 'dl-btn sub';
      o.innerHTML = '↗️ 새 탭에서 열기';
      o.addEventListener('click', () => window.open(url, '_blank'));
      box.appendChild(o);
    }

    li.querySelector('.slot').replaceWith(box);
  }
</script>
</body>
</html>
