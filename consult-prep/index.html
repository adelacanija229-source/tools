<title>상담 준비 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf5;
    --surface: #ffffff;
    --surface-2: #fff4e8;
    --text: #2b211d;
    --text-muted: #8a7a6f;
    --accent: #d97706;
    --accent-strong: #b45309;
    --accent-soft: #fef0dc;
    --border: #ecdfd0;
    --shadow: 0 1px 2px rgba(43,33,25,0.04), 0 8px 24px rgba(43,33,25,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1512;
      --surface: #241d18;
      --surface-2: #2e2119;
      --text: #f3e9de;
      --text-muted: #b3a294;
      --accent: #f59e0b;
      --accent-strong: #fbbf24;
      --accent-soft: #3a2a18;
      --border: #3c2f26;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1512;
    --surface: #241d18;
    --surface-2: #2e2119;
    --text: #f3e9de;
    --text-muted: #b3a294;
    --accent: #f59e0b;
    --accent-strong: #fbbf24;
    --accent-soft: #3a2a18;
    --border: #3c2f26;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 28px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 680px; }

  header { margin-bottom: 20px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--accent-strong); background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 10px 0 4px; text-wrap: balance; }
  header p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 20px; box-shadow: var(--shadow);
  }
  .card + .card { margin-top: 16px; }

  .step { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .step-num {
    width: 22px; height: 22px; border-radius: 50%; background: var(--accent-soft);
    color: var(--accent-strong); display: inline-flex; align-items: center;
    justify-content: center; font-size: 12px; font-weight: 700;
  }
  .step-title { font-size: 14px; font-weight: 700; }
  .step-hint { font-size: 12px; color: var(--text-muted); margin-left: auto; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input[type="text"], .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
  }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer;
    font-family: inherit; text-decoration: none;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn[aria-disabled="true"] { opacity: 0.45; pointer-events: none; }

  .drop {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--surface);
    padding: 30px 20px; text-align: center; cursor: pointer;
  }
  .drop:hover { border-color: var(--accent); background: var(--surface-2); }
  .drop input { display: none; }
  .drop-icon { font-size: 26px; margin-bottom: 6px; }

  .opt-label { font-size: 12px; font-weight: 700; color: var(--text-muted); margin: 16px 0 8px; letter-spacing: 0.02em; }

  .style-toggle { display: flex; flex-wrap: wrap; gap: 8px; }
  .style-btn {
    flex: 1 1 150px; padding: 10px; border: 2px solid var(--border); background: var(--surface);
    border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer; color: var(--text-muted);
  }
  .style-btn.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 9px 14px; border: 2px solid var(--border); background: var(--surface);
    border-radius: 8px; font-family: inherit; font-size: 13px; font-weight: 600;
    color: var(--text-muted); cursor: pointer;
  }
  .chip.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }

  .slider-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .slider-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }

  #preview-wrap { display: none; margin-top: 18px; }
  #preview-wrap.show { display: block; }
  #preview-canvas {
    width: 100%; height: auto; border-radius: 10px;
    border: 1px solid var(--border); background: #fff;
  }
  #busy { font-size: 12px; color: var(--accent-strong); margin-top: 8px; }

  .info-toggle {
    display: flex; align-items: center; gap: 8px; margin-top: 14px;
    font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer;
  }
  .info-toggle input { width: 16px; height: 16px; accent-color: var(--accent); }
  #info-fields { margin-top: 12px; padding: 14px; background: var(--surface-2); border-radius: 10px; }
  #info-fields .field:last-child { margin-bottom: 0; }

  footer { margin-top: 22px; display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  footer span { display: inline-flex; align-items: center; gap: 5px; }

  [hidden] { display: none !important; }
</style>

<main>
  <header>
    <span class="eyebrow">🏠 LOCAL WEB APP</span>
    <h1>고객 상담 준비 도구</h1>
    <p>평면도를 찾아 라인 도면·공간 구분 스타일로 바꾸고, 아파트 정보까지 얹어 상담 자료 한 장으로 저장합니다. 모든 처리는 이 브라우저 안에서만 이뤄집니다.</p>
  </header>

  <!-- 1단계: 평면도 찾기 -->
  <div class="card">
    <div class="step">
      <span class="step-num">1</span>
      <span class="step-title">평면도 찾기</span>
      <span class="step-hint">이미 있으면 건너뛰세요</span>
    </div>
    <div class="row2">
      <div class="field">
        <label for="apt-name">아파트 단지명</label>
        <input type="text" id="apt-name" placeholder="예: 도곡 삼성 래미안">
      </div>
      <div class="field">
        <label for="apt-pyeong">평형</label>
        <input type="text" id="apt-pyeong" placeholder="예: 34평">
      </div>
    </div>
    <a class="btn" id="search-link" href="#" target="_blank" rel="noopener" aria-disabled="true">🔍 구글 이미지에서 평면도 검색</a>
  </div>

  <!-- 2단계: 도면 변환 -->
  <div class="card">
    <div class="step">
      <span class="step-num">2</span>
      <span class="step-title">도면 변환</span>
    </div>

    <div class="drop" id="drop">
      <div class="drop-icon">📐</div>
      <strong>평면도 이미지를 끌어다 놓거나 클릭해서 선택하세요</strong>
      <div id="paste-hint" style="color:var(--text-muted); font-size:13px; margin-top:4px;">사이트에서 캡처한 뒤 <b>Ctrl + V</b>로 바로 붙여넣어도 됩니다</div>
      <input type="file" id="file-input" accept="image/*">
    </div>

    <div class="opt-label">스타일</div>
    <div class="style-toggle">
      <button type="button" class="style-btn active" data-style="line">⬛ 라인 도면</button>
      <button type="button" class="style-btn" data-style="zone">🎨 공간 구분</button>
    </div>

    <div class="opt-label">대칭</div>
    <div class="chip-row">
      <button type="button" class="chip" id="flip-h">↔ 좌우 반전</button>
      <button type="button" class="chip" id="flip-v">↕ 상하 반전</button>
    </div>

    <div class="opt-label">선명도</div>
    <div class="slider-row">
      <input type="range" id="threshold" min="80" max="220" value="150">
    </div>

    <div id="preview-wrap">
      <canvas id="preview-canvas"></canvas>
      <div id="busy" hidden>공간을 나누는 중…</div>

      <label class="info-toggle">
        <input type="checkbox" id="include-info-toggle">
        <span>📋 도면 위쪽 여백에 아파트 정보를 넣어서 저장</span>
      </label>
      <div id="info-fields" hidden>
        <div class="row2">
          <div class="field"><label for="s-name">아파트명</label><input type="text" id="s-name" placeholder="예: 도곡 삼성"></div>
          <div class="field"><label for="s-pyeong">평형</label><input type="text" id="s-pyeong" placeholder="예: 34"></div>
        </div>
        <div class="row2">
          <div class="field"><label for="s-year">준공년도</label><input type="text" id="s-year" placeholder="예: 2000년"></div>
          <div class="field"><label for="s-area">전용면적</label><input type="text" id="s-area" placeholder="예: 84.98"></div>
        </div>
        <div class="field">
          <label for="s-heating">난방 방식</label>
          <select id="s-heating">
            <option value="">-</option>
            <option value="개별난방 (도시가스)">개별난방 (도시가스)</option>
            <option value="지역난방">지역난방</option>
            <option value="중앙난방">중앙난방</option>
            <option value="기타">기타</option>
          </select>
        </div>
      </div>

      <button type="button" class="btn" id="download-style-btn" style="margin-top:12px;">⬇️ 이미지 저장</button>
    </div>
  </div>

  <footer>
    <span>🔒 이미지·정보는 서버로 전송되지 않음</span>
    <span>📱 모바일에서도 동작</span>
  </footer>
</main>

<script>
  // ---------- 공통 ----------
  const $ = (id) => document.getElementById(id);
  const val = (id) => ($(id) ? $(id).value.trim() : '');

  let downloadsApi = null;
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        downloadsApi = await window.claude.use('downloads');
      }
    } catch (e) { downloadsApi = null; }
  })();

  async function downloadBlob(blob, filename, btn) {
    const original = btn.innerHTML;
    if (downloadsApi) {
      btn.disabled = true;
      btn.innerHTML = '저장 중…';
      try {
        await downloadsApi.save({ filename, data: blob });
        btn.innerHTML = '✅ 저장됨';
      } catch (err) {
        btn.innerHTML = err && err.code === 'declined' ? original : '저장 실패';
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
        return;
      }
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ---------- 1단계: 평면도 검색 ----------
  // 링크는 구글 이미지 검색 하나만 둡니다. site: 검색은 결과 페이지만 열리고
  // 정작 사이트로는 못 가서 뺐습니다.
  const aptName = $('apt-name');
  const aptPyeong = $('apt-pyeong');
  const searchLink = $('search-link');

  function updateSearchLink() {
    const name = aptName.value.trim();
    if (!name) {
      searchLink.href = '#';
      searchLink.setAttribute('aria-disabled', 'true');
      return;
    }
    const pyeong = aptPyeong.value.trim();
    const q = [name, pyeong, '평면도'].filter(Boolean).join(' ');
    searchLink.href = 'https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(q);
    searchLink.removeAttribute('aria-disabled');
  }
  aptName.addEventListener('input', updateSearchLink);
  aptPyeong.addEventListener('input', updateSearchLink);

  // ---------- 2단계: 도면 변환 ----------
  const drop = $('drop');
  const fileInput = $('file-input');
  const previewWrap = $('preview-wrap');
  const previewCanvas = $('preview-canvas');
  const thresholdInput = $('threshold');
  const busy = $('busy');
  const styleBtns = [...document.querySelectorAll('.style-btn')];
  const flipHBtn = $('flip-h');
  const flipVBtn = $('flip-v');
  const downloadStyleBtn = $('download-style-btn');
  const includeInfoToggle = $('include-info-toggle');
  const infoFieldsWrap = $('info-fields');

  let currentImg = null;
  let currentStyle = 'line';
  let flipH = false;
  let flipV = false;

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor = ''; });
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.style.borderColor = '';
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) loadImage(f);
  });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadImage(e.target.files[0]); });

  // 사이트에서 평면도를 캡처한 뒤 그대로 붙여넣을 수 있게 합니다.
  // 글자를 붙여넣을 때는 건드리지 않고, 이미지일 때만 받습니다.
  document.addEventListener('paste', (e) => {
    const items = e.clipboardData && e.clipboardData.items;
    if (!items) return;
    for (const item of items) {
      if (item.kind === 'file' && item.type.startsWith('image/')) {
        const file = item.getAsFile();
        if (!file) continue;
        e.preventDefault();
        loadImage(file);
        drop.style.borderColor = 'var(--accent)';
        setTimeout(() => { drop.style.borderColor = ''; }, 700);
        return;
      }
    }
  });

  // 맥에서는 단축키 표기를 바꿔 줍니다.
  if (/Mac|iPhone|iPad/.test(navigator.platform || navigator.userAgent)) {
    $('paste-hint').innerHTML = '사이트에서 캡처한 뒤 <b>⌘ + V</b>로 바로 붙여넣어도 됩니다';
  }

  function loadImage(file) {
    const img = new Image();
    img.onload = () => {
      currentImg = img;
      previewWrap.classList.add('show');
      // 아파트명을 이미 적었으면 정보 칸에 그대로 옮겨 둡니다.
      if (!val('s-name') && aptName.value.trim()) $('s-name').value = aptName.value.trim();
      if (!val('s-pyeong') && aptPyeong.value.trim()) $('s-pyeong').value = aptPyeong.value.trim();
      renderStyle();
    };
    img.src = URL.createObjectURL(file);
  }

  styleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      styleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      renderStyle();
    });
  });

  flipHBtn.addEventListener('click', () => {
    flipH = !flipH;
    flipHBtn.classList.toggle('active', flipH);
    renderStyle();
  });
  flipVBtn.addEventListener('click', () => {
    flipV = !flipV;
    flipVBtn.classList.toggle('active', flipV);
    renderStyle();
  });

  // 공간 구분은 픽셀을 훑어야 해서, 슬라이더를 끄는 동안엔 잠깐 기다렸다 계산합니다.
  let sliderTimer = null;
  thresholdInput.addEventListener('input', () => {
    if (currentStyle !== 'zone') { renderStyle(); return; }
    clearTimeout(sliderTimer);
    sliderTimer = setTimeout(renderStyle, 160);
  });

  includeInfoToggle.addEventListener('change', () => {
    infoFieldsWrap.hidden = !includeInfoToggle.checked;
  });

  // 숫자만 적어도 단위가 붙습니다.
  function attachUnit(id, unit) {
    const el = $(id);
    el.addEventListener('blur', () => {
      const v = el.value.trim();
      if (v && /^[0-9]+(\.[0-9]+)?$/.test(v)) el.value = v + unit;
    });
  }
  attachUnit('s-pyeong', '평');
  attachUnit('s-area', '㎡');

  function renderStyle() {
    if (!currentImg) return;
    if (currentStyle !== 'zone') {
      busy.hidden = true;
      drawStyle();
      return;
    }
    // 공간 구분은 계산이 길어질 수 있어, 안내를 먼저 그려 놓고 시작합니다.
    busy.hidden = false;
    requestAnimationFrame(() => requestAnimationFrame(() => {
      drawStyle();
      busy.hidden = true;
    }));
  }

  function drawStyle() {
    const W = currentImg.width, H = currentImg.height;
    previewCanvas.width = W;
    previewCanvas.height = H;
    const ctx = previewCanvas.getContext('2d', { willReadFrequently: true });

    ctx.save();
    ctx.setTransform(flipH ? -1 : 1, 0, 0, flipV ? -1 : 1, flipH ? W : 0, flipV ? H : 0);
    ctx.drawImage(currentImg, 0, 0);
    ctx.restore();

    const imageData = ctx.getImageData(0, 0, W, H);
    const d = imageData.data;
    const threshold = Number(thresholdInput.value);

    if (currentStyle === 'zone') {
      applyZoneColors(d, W, H, threshold);
    } else {
      for (let i = 0; i < d.length; i += 4) {
        const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
        const v = gray < threshold ? 0 : 255;
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
        d[i + 3] = 255;
      }
    }
    ctx.putImageData(imageData, 0, 0);
  }

  // 벽(어두운 선)으로 둘러싸인 방을 하나씩 찾아 서로 다른 색으로 칠합니다.
  // 따뜻한 뉴트럴 그레이. 붙어 있는 방이 헷갈리지 않게 밝기를 지그재그로 놓았습니다.
  const ZONE_COLORS = [
    [232, 228, 223], [176, 170, 163], [216, 211, 205], [195, 189, 182],
    [225, 221, 216], [185, 179, 172], [206, 201, 195], [166, 160, 153],
  ];

  function applyZoneColors(d, w, h, threshold) {
    const n = w * h;
    const wall = new Uint8Array(n);
    for (let p = 0; p < n; p++) {
      const i = p * 4;
      wall[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) < threshold ? 1 : 0;
    }

    const label = new Int32Array(n).fill(-1);
    const stack = new Int32Array(n);
    const regions = [];

    for (let start = 0; start < n; start++) {
      if (wall[start] || label[start] !== -1) continue;
      const id = regions.length;
      let sp = 0;
      stack[sp++] = start;
      label[start] = id;
      let area = 0;
      let touchesBorder = false;

      while (sp > 0) {
        const cur = stack[--sp];
        area++;
        const x = cur % w;
        const y = (cur / w) | 0;
        if (x === 0 || y === 0 || x === w - 1 || y === h - 1) touchesBorder = true;
        if (x > 0)     { const nb = cur - 1; if (!wall[nb] && label[nb] === -1) { label[nb] = id; stack[sp++] = nb; } }
        if (x < w - 1) { const nb = cur + 1; if (!wall[nb] && label[nb] === -1) { label[nb] = id; stack[sp++] = nb; } }
        if (y > 0)     { const nb = cur - w; if (!wall[nb] && label[nb] === -1) { label[nb] = id; stack[sp++] = nb; } }
        if (y < h - 1) { const nb = cur + w; if (!wall[nb] && label[nb] === -1) { label[nb] = id; stack[sp++] = nb; } }
      }
      regions.push({ area, touchesBorder });
    }

    // 도면 바깥(테두리에 닿는 영역)과 글자 사이 자잘한 틈은 칠하지 않습니다.
    const minArea = Math.max(300, Math.floor(n * 0.0006));
    const colorOf = new Int32Array(regions.length).fill(-1);
    let ci = 0;
    regions
      .map((r, i) => ({ r, i }))
      .filter(({ r }) => !r.touchesBorder && r.area >= minArea)
      .sort((a, b) => b.r.area - a.r.area)
      .forEach(({ i }) => { colorOf[i] = ci % ZONE_COLORS.length; ci++; });

    for (let p = 0; p < n; p++) {
      const i = p * 4;
      if (wall[p]) {
        d[i] = 38; d[i + 1] = 34; d[i + 2] = 31;
      } else {
        const c = colorOf[label[p]];
        if (c >= 0) {
          const col = ZONE_COLORS[c];
          d[i] = col[0]; d[i + 1] = col[1]; d[i + 2] = col[2];
        } else {
          d[i] = 255; d[i + 1] = 255; d[i + 2] = 255;
        }
      }
      d[i + 3] = 255;
    }
  }

  // ---------- 저장 ----------
  async function buildStyleWithInfoCanvas() {
    await document.fonts.ready;
    const W = previewCanvas.width, H = previewCanvas.height;
    const out = document.createElement('canvas');
    out.width = W;
    out.height = H;
    const ctx = out.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, W, H);

    const name = val('s-name');
    const facts = [val('s-pyeong'), val('s-area'), val('s-year'), val('s-heating')].filter(Boolean);
    if (!name && !facts.length) {
      ctx.drawImage(previewCanvas, 0, 0);
      return out;
    }

    const pad = Math.max(14, Math.round(W * 0.022));
    const nameSize = Math.max(17, Math.round(W * 0.026));
    const factSize = Math.max(12, Math.round(W * 0.017));
    const gap = Math.round(factSize * 0.7);
    const factLine = facts.join(' · ');

    // 도면을 조금 줄여 위쪽에 여백을 만들고, 그 자리에 글자만 올립니다.
    const bandH = pad + (name ? nameSize : 0)
      + (name && factLine ? gap : 0)
      + (factLine ? factSize : 0) + pad;
    const scale = (H - bandH) / H;
    ctx.drawImage(previewCanvas, (W - W * scale) / 2, bandH, W * scale, H * scale);

    ctx.textAlign = 'right';
    ctx.textBaseline = 'alphabetic';
    let y = pad;

    if (name) {
      y += nameSize * 0.82;
      ctx.font = `700 ${nameSize}px "Noto Sans KR"`;
      ctx.fillStyle = '#2b2320';
      ctx.fillText(name, W - pad, y);
      y += nameSize * 0.18 + gap;
    }

    if (factLine) {
      // 한 줄에 안 들어가면 글자를 조금 줄여서 맞춥니다.
      let fs = factSize;
      const maxW = W - pad * 2;
      ctx.font = `500 ${fs}px "Noto Sans KR"`;
      while (ctx.measureText(factLine).width > maxW && fs > 9) {
        fs -= 1;
        ctx.font = `500 ${fs}px "Noto Sans KR"`;
      }
      ctx.fillStyle = '#6b5d53';
      ctx.fillText(factLine, W - pad, y + fs * 0.82);
    }

    return out;
  }

  downloadStyleBtn.addEventListener('click', async () => {
    if (!currentImg) return;
    const finalCanvas = includeInfoToggle.checked ? await buildStyleWithInfoCanvas() : previewCanvas;
    finalCanvas.toBlob((blob) => {
      if (blob) downloadBlob(blob, `floorplan_${currentStyle}.png`, downloadStyleBtn);
    }, 'image/png');
  });
</script>
