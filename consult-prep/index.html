<title>상담 준비 도구</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fffaf5;
    --surface: #ffffff;
    --surface-2: #fff4e8;
    --text: #2b211d;
    --text-muted: #8a7a6f;
    --accent: #d97706;
    --accent-strong: #b45309;
    --accent-soft: #fef0dc;
    --border: #ecdfd0;
    --success: #15803d;
    --blueprint: #1a3a5c;
    --shadow: 0 1px 2px rgba(43,33,25,0.04), 0 8px 24px rgba(43,33,25,0.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1512;
      --surface: #241d18;
      --surface-2: #2e2119;
      --text: #f3e9de;
      --text-muted: #b3a294;
      --accent: #f59e0b;
      --accent-strong: #fbbf24;
      --accent-soft: #3a2a18;
      --border: #3c2f26;
      --success: #4ade80;
      --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1512;
    --surface: #241d18;
    --surface-2: #2e2119;
    --text: #f3e9de;
    --text-muted: #b3a294;
    --accent: #f59e0b;
    --accent-strong: #fbbf24;
    --accent-soft: #3a2a18;
    --border: #3c2f26;
    --success: #4ade80;
    --shadow: 0 1px 2px rgba(0,0,0,0.2), 0 8px 24px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Noto Sans KR", "Malgun Gothic", sans-serif;
    padding: 28px 16px 48px;
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 680px; }

  header { margin-bottom: 20px; }
  .eyebrow {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12px; font-weight: 700; letter-spacing: 0.06em;
    color: var(--accent-strong); background: var(--accent-soft);
    padding: 4px 10px; border-radius: 999px;
  }
  h1 { font-size: 22px; font-weight: 800; margin: 10px 0 4px; text-wrap: balance; }
  header p { margin: 0; color: var(--text-muted); font-size: 14px; line-height: 1.6; }

  .tabs {
    display: flex; gap: 6px; margin-top: 20px;
    background: var(--surface-2); padding: 4px; border-radius: 10px;
  }
  .tab-btn {
    flex: 1; padding: 10px 8px; border: none; background: transparent;
    color: var(--text-muted); font-size: 13px; font-weight: 600;
    font-family: inherit; border-radius: 7px; cursor: pointer;
  }
  .tab-btn.active { background: var(--surface); color: var(--accent-strong); box-shadow: var(--shadow); }

  .panel { display: none; margin-top: 20px; }
  .panel.active { display: block; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 6px; }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea {
    width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--bg); color: var(--text); font-family: inherit; font-size: 14px;
  }
  .field textarea { resize: vertical; min-height: 60px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none;
    border-radius: 9px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn.secondary { background: var(--surface-2); color: var(--accent-strong); }
  .btn.secondary:hover { background: var(--border); }

  .link-list { display: flex; flex-direction: column; gap: 8px; margin-top: 16px; }
  .link-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 12px 14px; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; text-decoration: none; color: var(--text); box-shadow: var(--shadow);
  }
  .link-item:hover { border-color: var(--accent); }
  .link-item .name { font-size: 14px; font-weight: 600; }
  .link-item .desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .link-item .go { color: var(--accent-strong); font-size: 13px; font-weight: 700; white-space: nowrap; }

  .drop {
    border: 2px dashed var(--border); border-radius: 14px; background: var(--surface);
    padding: 30px 20px; text-align: center; cursor: pointer;
  }
  .drop:hover { border-color: var(--accent); background: var(--surface-2); }
  .drop input { display: none; }
  .drop-icon { font-size: 26px; margin-bottom: 6px; }

  .style-toggle { display: flex; gap: 8px; margin: 16px 0; }
  .style-btn {
    flex: 1; padding: 10px; border: 2px solid var(--border); background: var(--surface);
    border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text-muted);
  }
  .style-btn.active { border-color: var(--accent); color: var(--accent-strong); background: var(--accent-soft); }

  .slider-row { display: flex; align-items: center; gap: 10px; margin: 14px 0; }
  .slider-row label { font-size: 13px; color: var(--text-muted); white-space: nowrap; }
  .slider-row input[type=range] { flex: 1; accent-color: var(--accent); }

  #preview-wrap { display: none; margin-top: 16px; }
  #preview-wrap.show { display: block; }
  #preview-canvas, #card-canvas { width: 100%; height: auto; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); }

  footer { margin-top: 22px; display: flex; gap: 16px; font-size: 12px; color: var(--text-muted); flex-wrap: wrap; }
  footer span { display: inline-flex; align-items: center; gap: 5px; }

  [hidden] { display: none !important; }
</style>

<main>
  <header>
    <span class="eyebrow">🏠 LOCAL WEB APP</span>
    <h1>고객 상담 준비 도구</h1>
    <p>상담 전 평면도 찾기부터 도면 스타일 변환, 아파트 정보 카드까지 한 번에 준비합니다. 모든 처리는 이 브라우저 안에서만 이뤄집니다.</p>
  </header>

  <div class="tabs">
    <button type="button" class="tab-btn active" data-tab="links">🔍 평면도 찾기</button>
    <button type="button" class="tab-btn" data-tab="style">📐 도면 스타일 변환</button>
    <button type="button" class="tab-btn" data-tab="cardtab">📋 아파트 정보 카드</button>
  </div>

  <!-- 탭 1: 평면도 찾기 -->
  <div class="panel active" id="panel-links">
    <div class="card">
      <div class="field">
        <label for="apt-name">아파트 단지명</label>
        <input type="text" id="apt-name" placeholder="예: 래미안원베일리">
      </div>
      <button type="button" class="btn" id="make-links-btn">🔗 검색 링크 만들기</button>
      <div class="link-list" id="link-list"></div>
    </div>
  </div>

  <!-- 탭 2: 도면 스타일 변환 -->
  <div class="panel" id="panel-style">
    <div class="card">
      <div class="drop" id="drop">
        <div class="drop-icon">📐</div>
        <strong>평면도 이미지를 드래그하거나 클릭해서 선택하세요</strong>
        <div style="color:var(--text-muted); font-size:13px; margin-top:4px;">캡처한 스크린샷도 괜찮습니다</div>
        <input type="file" id="file-input" accept="image/*">
      </div>

      <div class="style-toggle">
        <button type="button" class="style-btn active" data-style="line">⬛ 라인 도면 (흰 배경)</button>
        <button type="button" class="style-btn" data-style="blueprint">🔷 청사진 스타일</button>
      </div>
      <div class="slider-row">
        <label for="threshold">선명도</label>
        <input type="range" id="threshold" min="80" max="220" value="150">
      </div>

      <div id="preview-wrap">
        <canvas id="preview-canvas"></canvas>
        <button type="button" class="btn" id="download-style-btn" style="margin-top:12px;">⬇️ 이미지 저장</button>
      </div>
    </div>
  </div>

  <!-- 탭 3: 아파트 정보 카드 -->
  <div class="panel" id="panel-cardtab">
    <div class="card">
      <div class="field">
        <label for="c-name">아파트명</label>
        <input type="text" id="c-name" placeholder="예: 래미안원베일리">
      </div>
      <div class="row2">
        <div class="field">
          <label for="c-year">준공년도</label>
          <input type="text" id="c-year" placeholder="예: 2023년">
        </div>
        <div class="field">
          <label for="c-households">총 세대수</label>
          <input type="text" id="c-households" placeholder="예: 2990세대">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="c-area-ex">전용면적</label>
          <input type="text" id="c-area-ex" placeholder="예: 84.98㎡">
        </div>
        <div class="field">
          <label for="c-area-sup">공급면적</label>
          <input type="text" id="c-area-sup" placeholder="예: 112.4㎡">
        </div>
      </div>
      <div class="row2">
        <div class="field">
          <label for="c-heating">난방 방식</label>
          <select id="c-heating">
            <option value="개별난방 (도시가스)">개별난방 (도시가스)</option>
            <option value="지역난방">지역난방</option>
            <option value="중앙난방">중앙난방</option>
            <option value="기타">기타</option>
          </select>
        </div>
        <div class="field">
          <label for="c-parking">주차 대수</label>
          <input type="text" id="c-parking" placeholder="예: 세대당 1.2대">
        </div>
      </div>
      <div class="field">
        <label for="c-memo">메모</label>
        <textarea id="c-memo" placeholder="상담 전 체크할 내용을 자유롭게 적어주세요"></textarea>
      </div>
      <button type="button" class="btn" id="make-card-btn">📋 정보 카드 만들기</button>

      <div id="card-preview-wrap" style="display:none; margin-top:16px;">
        <canvas id="card-canvas"></canvas>
        <button type="button" class="btn" id="download-card-btn" style="margin-top:12px;">⬇️ 카드 이미지 저장</button>
      </div>
    </div>
  </div>

  <footer>
    <span>🔒 이미지·정보는 서버로 전송되지 않음</span>
    <span>📱 모바일에서도 동작</span>
  </footer>
</main>

<script>
  // ---------- 공통 ----------
  let downloadsApi = null;
  (async () => {
    try {
      if (window.claude && typeof window.claude.use === 'function') {
        downloadsApi = await window.claude.use('downloads');
      }
    } catch (e) { downloadsApi = null; }
  })();

  async function downloadBlob(blob, filename, btn) {
    const original = btn.innerHTML;
    if (downloadsApi) {
      btn.disabled = true;
      btn.innerHTML = '저장 중…';
      try {
        await downloadsApi.save({ filename, data: blob });
        btn.innerHTML = '✅ 저장됨';
      } catch (err) {
        btn.innerHTML = err && err.code === 'declined' ? original : '저장 실패';
        setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
        return;
      }
      setTimeout(() => { btn.innerHTML = original; btn.disabled = false; }, 1500);
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  // ---------- 탭 전환 ----------
  const tabBtns = [...document.querySelectorAll('.tab-btn')];
  tabBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      tabBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      document.getElementById('panel-' + btn.dataset.tab).classList.add('active');
    });
  });

  // ---------- 탭 1: 검색 링크 ----------
  const aptNameInput = document.getElementById('apt-name');
  const linkList = document.getElementById('link-list');

  function buildLinks(name) {
    const q = encodeURIComponent(name);
    const qPlan = encodeURIComponent(name + ' 평면도');
    return [
      { label: '네이버 지도에서 위치 보기', desc: '단지 위치·주변 정보 확인', url: `https://map.naver.com/p/search/${q}` },
      { label: '구글 이미지에서 평면도 검색', desc: '가장 빠르게 평면도 이미지 모아보기', url: `https://www.google.com/search?q=${qPlan}&tbm=isch` },
      { label: '네이버 부동산 정보 검색', desc: '시세·단지 정보', url: `https://www.google.com/search?q=${qPlan}+site:new.land.naver.com` },
      { label: '호갱노노에서 검색', desc: '실거래가·단지 상세', url: `https://www.google.com/search?q=${q}+site:hogangnono.com` },
      { label: '아실(아파트실거래가)에서 검색', desc: '실거래가·평면도', url: `https://www.google.com/search?q=${qPlan}+site:asil.kr` },
      { label: 'KB부동산에서 검색', desc: '시세·단지 정보', url: `https://www.google.com/search?q=${q}+site:kbland.kr` },
    ];
  }

  function renderLinks(name) {
    linkList.innerHTML = '';
    if (!name.trim()) return;
    buildLinks(name.trim()).forEach(item => {
      const a = document.createElement('a');
      a.className = 'link-item';
      a.href = item.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.innerHTML = `<div><div class="name">${item.label}</div><div class="desc">${item.desc}</div></div><span class="go">열기 ↗</span>`;
      linkList.appendChild(a);
    });
  }

  document.getElementById('make-links-btn').addEventListener('click', () => renderLinks(aptNameInput.value));
  aptNameInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') renderLinks(aptNameInput.value); });

  // ---------- 탭 2: 도면 스타일 변환 ----------
  const drop = document.getElementById('drop');
  const fileInput = document.getElementById('file-input');
  const previewWrap = document.getElementById('preview-wrap');
  const previewCanvas = document.getElementById('preview-canvas');
  const thresholdInput = document.getElementById('threshold');
  const styleBtns = [...document.querySelectorAll('.style-btn')];
  const downloadStyleBtn = document.getElementById('download-style-btn');

  let currentImg = null;
  let currentStyle = 'line';

  drop.addEventListener('click', () => fileInput.click());
  drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.style.borderColor = 'var(--accent)'; });
  drop.addEventListener('dragleave', () => { drop.style.borderColor = ''; });
  drop.addEventListener('drop', (e) => {
    e.preventDefault();
    drop.style.borderColor = '';
    const f = [...e.dataTransfer.files].find(f => f.type.startsWith('image/'));
    if (f) loadImage(f);
  });
  fileInput.addEventListener('change', (e) => { if (e.target.files[0]) loadImage(e.target.files[0]); });

  function loadImage(file) {
    const img = new Image();
    img.onload = () => {
      currentImg = img;
      previewWrap.classList.add('show');
      renderStyle();
    };
    img.src = URL.createObjectURL(file);
  }

  styleBtns.forEach(btn => {
    btn.addEventListener('click', () => {
      styleBtns.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentStyle = btn.dataset.style;
      renderStyle();
    });
  });
  thresholdInput.addEventListener('input', renderStyle);

  function renderStyle() {
    if (!currentImg) return;
    previewCanvas.width = currentImg.width;
    previewCanvas.height = currentImg.height;
    const ctx = previewCanvas.getContext('2d');
    ctx.drawImage(currentImg, 0, 0);
    const imageData = ctx.getImageData(0, 0, previewCanvas.width, previewCanvas.height);
    const d = imageData.data;
    const threshold = Number(thresholdInput.value);
    const blueprintBg = [26, 58, 92];
    for (let i = 0; i < d.length; i += 4) {
      const gray = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      const isLine = gray < threshold;
      if (currentStyle === 'line') {
        const v = isLine ? 0 : 255;
        d[i] = v; d[i + 1] = v; d[i + 2] = v;
      } else {
        if (isLine) { d[i] = 255; d[i + 1] = 255; d[i + 2] = 255; }
        else { d[i] = blueprintBg[0]; d[i + 1] = blueprintBg[1]; d[i + 2] = blueprintBg[2]; }
      }
      d[i + 3] = 255;
    }
    ctx.putImageData(imageData, 0, 0);
  }

  downloadStyleBtn.addEventListener('click', () => {
    previewCanvas.toBlob((blob) => {
      if (blob) downloadBlob(blob, `floorplan_${currentStyle}.png`, downloadStyleBtn);
    }, 'image/png');
  });

  // ---------- 탭 3: 아파트 정보 카드 ----------
  const cardCanvas = document.getElementById('card-canvas');
  const cardPreviewWrap = document.getElementById('card-preview-wrap');
  const downloadCardBtn = document.getElementById('download-card-btn');

  function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
    const words = text.split('');
    let line = '';
    let curY = y;
    for (const ch of words) {
      const test = line + ch;
      if (ctx.measureText(test).width > maxWidth && line) {
        ctx.fillText(line, x, curY);
        line = ch;
        curY += lineHeight;
      } else {
        line = test;
      }
    }
    if (line) ctx.fillText(line, x, curY);
    return curY;
  }

  async function drawCard() {
    await document.fonts.ready;
    const W = 800, H = 1000;
    cardCanvas.width = W;
    cardCanvas.height = H;
    const ctx = cardCanvas.getContext('2d');

    // 배경
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#fffbf5');
    grad.addColorStop(1, '#fef3c7');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 헤더 배지
    ctx.fillStyle = '#ffffff';
    ctx.strokeStyle = '#fcd34d';
    ctx.lineWidth = 2;
    roundRect(ctx, 48, 48, 140, 34, 17);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#b45309';
    ctx.font = '700 14px "Noto Sans KR"';
    ctx.textBaseline = 'middle';
    ctx.fillText('🏠 상담 준비 자료', 62, 66);

    // 아파트명
    const name = document.getElementById('c-name').value || '아파트명 미입력';
    ctx.fillStyle = '#2b2320';
    ctx.font = '800 40px "Noto Sans KR"';
    ctx.textBaseline = 'alphabetic';
    wrapText(ctx, name, 48, 150, W - 96, 50);

    // 구분선
    ctx.strokeStyle = '#f0e8e1';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(48, 200);
    ctx.lineTo(W - 48, 200);
    ctx.stroke();

    // 정보 그리드
    const rows = [
      ['준공년도', document.getElementById('c-year').value || '-'],
      ['총 세대수', document.getElementById('c-households').value || '-'],
      ['전용면적', document.getElementById('c-area-ex').value || '-'],
      ['공급면적', document.getElementById('c-area-sup').value || '-'],
      ['난방 방식', document.getElementById('c-heating').value],
      ['주차 대수', document.getElementById('c-parking').value || '-'],
    ];

    let y = 250;
    const rowH = 70;
    rows.forEach(([label, value], i) => {
      if (i % 2 === 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)';
        roundRect(ctx, 48, y - 32, W - 96, rowH - 12, 10);
        ctx.fill();
      }
      ctx.fillStyle = '#8a7a6f';
      ctx.font = '600 15px "Noto Sans KR"';
      ctx.fillText(label, 68, y);
      ctx.fillStyle = '#2b2320';
      ctx.font = '700 20px "Noto Sans KR"';
      ctx.fillText(String(value), 220, y + 2);
      y += rowH;
    });

    // 메모
    const memo = document.getElementById('c-memo').value;
    if (memo) {
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#f3dfc4';
      ctx.lineWidth = 1;
      const memoY = y + 10;
      roundRect(ctx, 48, memoY, W - 96, 180, 10);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#9a3412';
      ctx.font = '700 15px "Noto Sans KR"';
      ctx.fillText('메모', 68, memoY + 32);
      ctx.fillStyle = '#524643';
      ctx.font = '400 16px "Noto Sans KR"';
      wrapText(ctx, memo, 68, memoY + 64, W - 136, 26);
    }

    // 푸터
    ctx.fillStyle = '#a8907a';
    ctx.font = '400 13px "Noto Sans KR"';
    const today = new Date();
    const dateStr = `${today.getFullYear()}. ${today.getMonth() + 1}. ${today.getDate()}. 생성`;
    ctx.fillText(dateStr, 48, H - 32);

    cardPreviewWrap.style.display = 'block';
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  document.getElementById('make-card-btn').addEventListener('click', drawCard);
  downloadCardBtn.addEventListener('click', () => {
    cardCanvas.toBlob((blob) => {
      const name = document.getElementById('c-name').value || 'apartment';
      if (blob) downloadBlob(blob, `${name}_정보카드.png`, downloadCardBtn);
    }, 'image/png');
  });
</script>
