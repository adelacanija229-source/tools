<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interior Reference Clipper</title>
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <main class="app">
      <header class="hero">
        <p class="eyebrow">Design Board Clipper</p>
        <h1>인테리어 레퍼런스 클리퍼</h1>
        <p class="subcopy">현재 보고 있는 자재·레퍼런스 페이지를 모아두는 라이브러리입니다.</p>
      </header>

      <section class="panel">
        <div class="section-head">
          <h2>클립 라이브러리</h2>
        </div>
        <label class="search-field">
          <span>검색</span>
          <input id="searchInput" type="search" placeholder="제목, 사이트, 메모로 찾기" autocomplete="off" />
        </label>
      </section>

      <section class="panel">
        <div class="actions">
          <button id="clipCurrentTab" class="primary-button" type="button">현재 페이지 클립</button>
          <button id="clearAll" class="ghost-button danger-button" type="button">전체 비우기</button>
        </div>
        <p id="statusMessage" class="status-message" aria-live="polite"></p>
      </section>

      <section class="panel">
        <div class="section-head">
          <h2>클립 목록</h2>
          <span id="clipCount" class="count-badge">0 / 0</span>
        </div>
        <div id="clipList" class="clip-list">
          <p class="empty-state">아직 저장된 링크가 없습니다.</p>
        </div>
      </section>
    </main>

    <template id="clipItemTemplate">
      <article class="clip-card">
        <div class="clip-media">
          <img class="clip-thumb" alt="" />
          <div class="image-suggestions"></div>
        </div>

        <div class="clip-body">
          <input class="clip-title" type="text" maxlength="180" />
          <div class="title-suggestions"></div>
          <div class="clip-detail-summary" hidden></div>
          <input class="clip-url" type="url" maxlength="2048" />
          <textarea
            class="clip-memo"
            rows="3"
            maxlength="400"
            placeholder="간단 메모를 남겨두세요. 예: 월넛 톤, 카페 현장 후보, 단가 확인 필요"
          ></textarea>

          <div class="clip-meta">
            <span class="clip-source"></span>
            <div class="clip-actions">
              <button class="mini-button title-copy-button" type="button">제목 복사</button>
              <button class="mini-button image-button" type="button">이미지 저장</button>
              <button class="mini-button open-button" type="button">열기</button>
              <button class="mini-button copy-button" type="button">링크 복사</button>
              <button class="remove-button" type="button">삭제</button>
            </div>
          </div>
        </div>
      </article>
    </template>

    <script src="./popup.js"></script>
  </body>
</html>
